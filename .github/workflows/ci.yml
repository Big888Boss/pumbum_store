name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: tsc, eslint, build, audit, vitest, infra-leak check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      NODE_OPTIONS: --max-old-space-size=1400
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Catalog and site contracts
        run: |
          npm run check:isolation
          npm run analytics:check
          npm run catalog:validate-water-filters

      - name: Lint
        run: npx eslint src scripts --ext .ts,.tsx,.js,.mjs

      - name: Build
        run: npm run build

      - name: Audit (high and critical)
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Infra-leak check (no real SSH logins, Tailscale hosts, VM names or home paths)
        run: |
          set -euo pipefail
          # Bracketed last characters keep this file from matching its own pattern.
          pattern='100[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}|vm260216481[9]|/home/administrato[r]|/home/dev47747[7]|/home/vira-admi[n]|/opt/plumbing_store_v[2]'
          if git grep -nE "$pattern"; then
            echo "::error::Internal infrastructure details found in the repository. Replace them with placeholders (see .codex-wiki/README.md)."
            exit 1
          fi
          echo "No internal infrastructure details found."
