name: plumbing_store_v2_brand_seo_20260716

services:
  v2-brand-seo:
    image: plumbing_store_v2-v2:brand-seo-20260716-v2
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=320
      PORT: 3010
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://477477.ru
      NEXT_PUBLIC_SITE_ENV: production
      NEXT_PUBLIC_YANDEX_METRIKA_ID: "109783471"
      CSP_MODE: enforce
    volumes:
      - /opt/plumbing_store_v2/public/images/products:/app/public/images/products:ro
    ports:
      - "127.0.0.1:3016:3010"
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3010/api/health"]
      interval: 120s
      timeout: 6s
      retries: 3
      # Parsing the 39 MB catalog is intentionally CPU-capped on the small host.
      # Keep the container in "starting" state until the first warmup completes.
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
