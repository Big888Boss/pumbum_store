name: plumbing_store_v2_carousel_polish_20260723

services:
  v2-carousel-polish:
    image: plumbing_store_v2-v2:carousel-polish-20260723-v1
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=320
      PORT: 3010
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://477477.ru
      NEXT_PUBLIC_SITE_ENV: production
      NEXT_PUBLIC_YANDEX_METRIKA_ID: "109783471"
      CSP_MODE: enforce
    volumes:
      - /opt/plumbing_store_v2/public/images/products:/app/public/images/products:ro
    ports:
      - "127.0.0.1:3022:3010"
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3010/api/health"]
      interval: 60s
      timeout: 6s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
