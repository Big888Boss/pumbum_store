name: plumbing_store_v2_espa_20260710

services:
  v2-espa:
    image: plumbing_store_v2-v2:espa-20260710-v6
    environment:
      NODE_ENV: production
      PORT: 3010
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://477477.ru
      NEXT_PUBLIC_SITE_ENV: production
      NEXT_PUBLIC_YANDEX_METRIKA_ID: "109783471"
    volumes:
      - ../public/images/products:/app/public/images/products:ro
    ports:
      - "127.0.0.1:3011:3010"
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
